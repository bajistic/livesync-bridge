services:
  bridge:
    build: .
    volumes:
      - /home/bajistic/clawd:/app/data/ivault
      - ./dat:/app/dat
    network_mode: host
    restart: unless-stopped
    command: ["deno", "run", "-A", "main.ts"]
    healthcheck:
      test: ["CMD-SHELL", "deno eval 'const r = await fetch(\"http://localhost:5984/\"); Deno.exit(r.status < 500 ? 0 : 1)'"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s
